name: APEX GitHub Runner

on:
  push:
    branches: [main]
    paths:
      - 'runs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate triggering request
        id: req
        shell: bash
        run: |
          REQUEST=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^runs/.+/request\.json$' | tail -1 || true)
          fi
          if [ -z "$REQUEST" ]; then
            REQUEST=$(find runs -name request.json -type f | sort | tail -1)
          fi
          if [ -z "$REQUEST" ]; then
            echo "No request.json found" >&2
            exit 2
          fi
          echo "Selected request: $REQUEST"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
      - name: Execute APEX package
        shell: bash
        run: |
          mkdir -p result
          python github_runner.py "${{ steps.req.outputs.request }}" result
      - name: Upload APEX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-result-${{ github.run_id }}
          path: result/
          if-no-files-found: error
